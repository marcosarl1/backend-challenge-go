name: backend-challenge-go

services:
  db:
    image: postgres:17.11-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  sqs:
    image: ministackorg/ministack:1.5.20
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AUTH: "true"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:4566/_localstack/health', timeout=3)); assert d['services'].get('sqs') == 'available'\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  sqs-init:
    image: docker.io/amazon/aws-cli:2.37.8
    depends_on:
      sqs:
        condition: service_healthy
    volumes:
      - ./deploy/sqs/init-queues.sh:/init-queues.sh:ro
      - ./deploy/iam:/policies:ro
      - ./.local:/credentials
    environment:
      AWS_ENDPOINT_URL: http://sqs:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    entrypoint: ["sh", "/init-queues.sh"]

  sqs-auth-check:
    image: docker.io/amazon/aws-cli:2.37.8
    profiles: ["tools"]
    depends_on:
      sqs:
        condition: service_healthy
    volumes:
      - ./deploy/sqs/check-auth.sh:/check-auth.sh:ro
      - ./.local:/credentials:ro
    environment:
      AWS_ENDPOINT_URL: http://sqs:4566
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["sh", "/check-auth.sh"]

  migrate:
    image: docker.io/migrate/migrate:v4.20.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate"]
    # Roda automaticamente no `docker compose up` para que o stack completo
    # suba sem passos manuais. `make migrate-up/down` continua funcionando
    # (o `run` sobrescreve este command).
    command: ["-path", "/migrations", "-database", "postgres://wagering:wagering@db:5432/wagering?sslmode=disable", "up"]
    restart: "no"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      sqs:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      sqs-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
      - "9090:9090"
    # Credencial do serviço gerada pelo sqs-init. É lida pelo entrypoint no
    # start do container (via volume), não via env_file: o Compose avalia
    # env_file antes do sqs-init rodar, então uma rotação de chaves deixaria
    # o app com a credencial antiga. O depends_on abaixo garante que o
    # sqs-init já terminou quando o app inicia.
    volumes:
      - ./.local:/credentials:ro
      - ./deploy/app/docker-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]
    environment:
      # Hostnames dentro da rede do Compose. O fluxo no host (`make run`)
      # usa os valores de `.env.example`, com `localhost`.
      HTTP_ADDR: ":8081"
      METRICS_ADDR: ":9090"
      DATABASE_URL: postgres://app:app@db:5432/wagering?sslmode=disable
      SQS_ENDPOINT: http://sqs:4566
      SQS_REGION: us-east-1
      AWS_REGION: us-east-1
      # O `iss` do token reflete o hostname usado para emiti-lo
      # (`localhost` no host); só a busca do JWKS usa o hostname interno.
      OIDC_ISSUER: http://localhost:8080/realms/wagering
      OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      OIDC_AUDIENCE: wagering-api
      CONSUMER_NAME: wager-consumer
      CONSUMER_WORKERS: 4
      OUTBOX_OWNER: outbox-1
      SHUTDOWN_TIMEOUT: 15s
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

volumes:
  pgdata:
