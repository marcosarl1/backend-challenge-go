name: backend-challenge-go

services:
  db:
    image: postgres:17.11-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  sqs:
    image: ministackorg/ministack:1.5.20
    ports:
      - "4566:4566"
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:4566/_localstack/health', timeout=3)); assert d['services'].get('sqs') == 'available'\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  sqs-init:
    image: docker.io/amazon/aws-cli:2.37.8
    depends_on:
      sqs:
        condition: service_healthy
    volumes:
      - ./deploy/sqs/init-queues.sh:/init-queues.sh:ro
    environment:
      AWS_ENDPOINT_URL: http://sqs:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["sh", "/init-queues.sh"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

volumes:
  pgdata:
